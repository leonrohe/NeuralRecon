name: neucon
channels:
  - pytorch
  - defaults
  - conda-forge
dependencies:
  - python=3.7.9
  - pytorch=1.6.0
  - torchvision=0.7.0
  - cudatoolkit=10.2
  - ipython
  - tqdm
  - numba
  - sparsehash  # dependency for torchsparse
  - glib  # Added to solve libgthread issue
  - libglu  # Added to solve GLU library issue
  - pip
  - pip:
      - -r requirements.txt